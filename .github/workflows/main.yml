name: Build Opus Client JAR

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest # Switched to Linux to handle permissions natively

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Grant Wrapper Execution Permissions
      run: |
        # This locates your script files and unlocks them globally
        if [ -d "OpusClient-Full" ]; then
          cd OpusClient-Full
          chmod +x gradlew || true
          echo "loom.officialMojangMappings=true" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
        else
          chmod +x gradlew || true
          echo "loom.officialMojangMappings=true" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
        fi

    - name: Run Remote Code Compilation
      run: |
        if [ -d "OpusClient-Full" ]; then
          cd OpusClient-Full
          ./gradlew genSources --no-daemon
          ./gradlew build --no-daemon
        else
          ./gradlew genSources --no-daemon
          ./gradlew build --no-daemon
        fi

    - name: Upload Completed JAR Asset
      uses: actions/upload-artifact@v4
      with:
        name: opus-client-build
        path: |
          **/build/libs/*.jar
