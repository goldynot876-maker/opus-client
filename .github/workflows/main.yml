name: Build Opus Client JAR

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.9

    - name: Auto-Detect and Build Mod
      run: |
        # Search the entire repository for build.gradle and change into that folder
        TARGET_DIR=$(find . -name "build.gradle" -exec dirname {} \;)
        echo "Found project folder at: $TARGET_DIR"
        cd "$TARGET_DIR"
        
        # Run the build command inside the correct folder
        gradle build
