name: Build Opus Client JAR

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Headless Properties
      run: |
        # Force create properties definitions directly in the active build folders
        if (Test-Path "OpusClient-Full") {
            cd OpusClient-Full
            echo "loom.officialMojangMappings=true" >> gradle.properties
            echo "org.gradle.daemon=false" >> gradle.properties
            gradle wrapper --gradle-version 8.7 --no-configure
        } else {
            echo "loom.officialMojangMappings=true" >> gradle.properties
            echo "org.gradle.daemon=false" >> gradle.properties
            gradle wrapper --gradle-version 8.7 --no-configure
        }

    - name: Run Remote Code Compilation
      run: |
        if (Test-Path "OpusClient-Full") {
            cd OpusClient-Full
            gradle genSources --no-daemon
            gradle build --no-daemon
        } else {
            gradle genSources --no-daemon
            gradle build --no-daemon
        }

    - name: Upload Completed JAR Asset
      uses: actions/upload-artifact@v4
      with:
        name: opus-client-build
        path: |
          **/build/libs/*.jar
